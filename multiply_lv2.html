<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>연산 마스터 | 곱셈의 개념 Lv.2</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Arial,'Noto Sans KR',sans-serif;background:#fffaf4;color:#4a3024}
.card{width:min(430px,100%);height:100dvh;margin:auto;background:#fffaf4;padding:11px 18px 10px;text-align:center;overflow:hidden}
.brand{display:inline-block;font-size:18px;font-weight:1000;color:#173b6b;background:#fff1df;border:1.8px solid #ef9d46;border-radius:22px;padding:8px 19px;margin:0 auto 5px}
.title{display:flex;align-items:center;justify-content:center;width:100%;min-height:66px;max-height:72px;padding:7px 12px;border:1.8px solid #ee9840;border-radius:28px;background:linear-gradient(135deg,#fff3df,#ffc982);color:#4b2d1d;font-size:clamp(22px,7.5vw,33px);font-weight:1000;letter-spacing:-1px}
.progress{font-size:23px;font-weight:1000;color:#7b5641;margin:5px 0 4px}
.remain{background:#fff3e5;border:1.6px solid #efa04d;border-radius:14px;padding:9px 8px;margin:0 0 12px;font-size:15px;font-weight:1000;color:#9a5a24}
.problem{min-height:110px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;align-content:center;gap:5px;font-size:clamp(20px,6vw,29px);line-height:1.35;font-weight:1000;color:#4b3023;margin:0 auto 4px}
.addexpr{max-width:100%;word-break:keep-all}.times{color:#e87524;font-size:1.12em}.answer{width:60px;height:58px;border:4px solid #ed8b31;border-radius:16px;background:white;color:#4b3023;text-align:center;font-size:27px;font-weight:1000;padding:0;box-shadow:4px 5px 0 rgba(114,67,34,.13);outline:none}
.hint{font-size:13px;color:#a37b62;font-weight:800;margin:1px 0 5px}.msg{height:18px;font-size:14px;font-weight:900;margin-bottom:4px}
.btn{border:0;cursor:pointer;font-weight:1000}.check{border-radius:18px;background:linear-gradient(#ffad4d,#ee7923);color:white;font-size:20px;padding:12px 38px;min-width:116px;box-shadow:0 4px 0 #c85d15}
.restart{margin-top:8px;background:#fff0df;color:#6b4229;border:1.5px solid #efb16f;border-radius:18px;font-size:15px;padding:9px 25px;box-shadow:0 3px 0 #efd1ad}
.done{display:none;height:100%;padding-top:15px}.done .brand{font-size:29px;padding:9px 23px}.scene{height:245px;position:relative;margin-top:12px}
.gobi{position:absolute;left:4px;bottom:0;width:165px;height:auto;object-fit:contain;filter:drop-shadow(0 5px 4px rgba(133,73,26,.12))}
.bubble{position:absolute;left:38%;top:23px;width:60%;min-height:150px;background:#fff0df;border-radius:52% 48% 50% 50%/48% 50% 50% 52%;display:flex;align-items:center;justify-content:center;padding:18px 12px;color:#6a4028;font-size:21px;line-height:1.35;font-weight:1000}
.bubble:before{content:"";position:absolute;left:-23px;bottom:27px;width:55px;height:40px;background:#fff0df;clip-path:polygon(100% 0,100% 70%,0 100%,37% 31%)}
.score{width:90%;margin:5px auto 13px;padding:13px 9px;background:#fffdf9;border:2px dashed #ee9840;border-radius:22px;font-size:17px;font-weight:900;line-height:1.5}
.retry,.again{padding:11px 22px;border-radius:17px;font-size:18px}.retry{background:white;color:#d86d20;border:2px solid #ed8b31;margin-bottom:9px}.again{background:#ee832e;color:white;box-shadow:0 4px 0 #c75f19}
@media(max-width:380px){.problem{font-size:clamp(18px,5.5vw,25px)}.answer{width:55px;height:55px}.gobi{width:150px}.bubble{font-size:19px}}
</style>
<style id="dot-groups">
.dotArea{

 align-items:center;justify-content:center;gap:6px 7px;
 margin:2px auto 4px;padding:7px 4px;
}
.dotGroup{

 gap:3px;width:auto;max-width:70px;min-height:27px;
 padding:5px 6px;border:1.5px solid #f4c99e;border-radius:12px;

}
.dot{

 box-shadow:0 1px 0 rgba(126,67,25,.12);
}

 .dot{width:7px;height:7px;flex-basis:7px}
 .problem{min-height:90px}
}
</style>
<style id='dot-layout-fix'>

</style><style id='expr-five-layout'>
.addexpr{

</style><style id="gobi-completion-fix">
#done .scene{height:255px;position:relative;margin-top:10px}

<style id="completion-two-buttons">
#done .completion-actions{display:flex;justify-content:center;gap:10px;width:92%;margin:0 auto 4px;}
#done .completion-actions .btn{margin:0!important;min-width:105px;padding:9px 16px!important;border-radius:15px!important;font-size:15px!important;}
#done .exit{background:#eee7df;color:#755b49;border:2px solid #d8c9bb;}
@media(max-height:650px){#done .completion-actions .btn{padding:7px 13px!important;font-size:14px!important;}}

<style id="custom-keypad-style">
.keypad{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:5px 0 7px;padding:0 2px;box-sizing:border-box}.keypad button{height:42px;border:2px solid #e99a49;border-radius:14px;background:#fffaf4;color:#4a3024;font-size:22px;font-weight:1000;box-shadow:0 3px 0 #efd0aa;touch-action:manipulation}.keypad button:active{transform:translateY(2px);box-shadow:0 1px 0 #efd0aa}.answer.active{outline:3px solid rgba(239,140,44,.22)}@media(max-height:760px){.keypad{gap:5px;margin:3px 0 5px}.keypad button{height:36px;font-size:19px}.problem{min-height:92px!important}.dotArea{max-height:135px;overflow:hidden}}
</style>

<script>
let audioCtx=null;
function ensureAudio(){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
 }catch(e){}
}
function unlockAudio(){
 ensureAudio();
 try{
  const b=audioCtx.createBuffer(1,1,22050),s=audioCtx.createBufferSource();
  s.buffer=b;s.connect(audioCtx.destination);s.start(0);
 }catch(e){}
}
function tone(freq,dur,type="sine",vol=.08){
 try{
  ensureAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  o.connect(g);g.connect(audioCtx.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
 }catch(e){}
}
function soundCorrect(){tone(660,.10,"sine",.09);setTimeout(()=>tone(880,.14,"sine",.08),90)}
function soundWrong(){tone(220,.13,"triangle",.07);setTimeout(()=>tone(180,.12,"triangle",.055),90)}
function soundComplete(){[[523,0],[659,120],[784,240],[1047,380]].forEach(n=>setTimeout(()=>tone(n[0],.18,"sine",.09),n[1]));}
document.addEventListener("pointerdown",unlockAudio,{once:true,capture:true});
document.addEventListener("touchstart",unlockAudio,{once:true,capture:true,passive:true});


const TOTAL=20;let problems=[],index=0,correct=0,wrong=[],review=false,start=Date.now(),checking=false,timer=null;
const $=id=>document.getElementById(id);function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}

function makeProblems(){
 let p=[];
 while(p.length<20){
  let n=rand(2,9), count=rand(2,10), key=n+'x'+count;
  if(!p.some(q=>q.key===key))p.push({n,count,key});
 }
 return p;
}

function renderAddExpr(q){
 let expr=$('expr');
 expr.innerHTML='';
 let rows=[];
 for(let i=0;i<q.count;i+=5) rows.push(Math.min(5,q.count-i));
 let used=0;
 rows.forEach((cnt,ri)=>{
   let row=document.createElement('span');
   row.className='exprRow';
   let parts=[];
   for(let j=0;j<cnt;j++) parts.push(q.n);
   row.textContent=(ri>0 ? '+ ' : '') + parts.join(' + ');
   expr.appendChild(row);
   used+=cnt;
 });
}

function renderDots(q){
 let area=$('dotArea'); area.innerHTML='';
 let rows;
 if(q.count<=5) rows=[q.count];
 else if(q.count===6) rows=[3,3];
 else if(q.count===7) rows=[4,3];
 else if(q.count===8) rows=[4,4];
 else if(q.count===9) rows=[5,4];
 else rows=[5,5];

 let made=0;
 rows.forEach(rowCount=>{
   let row=document.createElement('div');
   row.className='dotRow';
   for(let g=0;g<rowCount;g++){
     let group=document.createElement('div');
     group.className='dotGroup';
     for(let i=0;i<q.n;i++){
       let d=document.createElement('i');
       d.className='dot';
       group.appendChild(d);
     }
     row.appendChild(group);
     made++;
   }
   area.appendChild(row);
 });
}
function renderProblem(q){renderDots(q);
 renderAddExpr(q);
 $('answer1').value='';$('answer2').value='';
}
function expected(q){return [q.n,q.count]}

let activeAnswer=1;
function setActive(n){activeAnswer=n;document.querySelectorAll('#game .answer').forEach((e,i)=>e.classList.toggle('active',i===n-1));}
function show(){checking=false;clearTimeout(timer);if(index>=problems.length){finish();return}let q=problems[index];renderProblem(q);$('progress').textContent=`${index+1} / ${problems.length}`;$('remain').textContent=`남은 문제: ${problems.length-index}개`;$('msg').textContent='';setActive(1)}
function check(){if(checking)return;let q=problems[index],ex=expected(q),vals=[Number($('answer1').value),Number($('answer2').value)];if(vals.some((v,i)=>!document.getElementById('answer'+(i+1)).value))return;checking=true;let ok=ex.every((v,i)=>v===vals[i]);if(ok){soundCorrect();correct++;$('msg').textContent='정답!';$('msg').style.color='#27836c'}else{soundWrong();$('msg').textContent='정답: '+ex.join(' × ');$('msg').style.color='#c65a55';if(!review)wrong.push({...q})}index++;setTimeout(show,430)}
function finish(){soundComplete();$('game').style.display='none';$('done').style.display='block';$('done').style.visibility='visible';$('done').style.opacity='1';let sec=Math.round((Date.now()-start)/1000);if(review){$('bubble').innerHTML='틀린 문제 다시 풀기<br>성공! 축하해요!';$('score').innerHTML=`틀린 문제 ${problems.length}개 다시 풀기 완료!<br>걸린 시간 ${Math.floor(sec/60)}분 ${sec%60}초`;$('retry').style.display='none'}else{$('bubble').innerHTML=correct===20?'곱셈의 개념 Lv.2<br>성공! 축하해요!':'곱셈의 개념 Lv.2<br>다시 도전해요!';$('score').innerHTML=`20문제 완료!<br>${correct}개 정답 · ${wrong.length}개 다시 연습<br>걸린 시간 ${Math.floor(sec/60)}분 ${sec%60}초`;$('retry').style.display=wrong.length?'inline-block':'none'}}
function reset(){problems=makeProblems();index=0;correct=0;wrong=[];review=false;start=Date.now();$('done').style.display='none';$('game').style.display='block';show()}
function retryWrong(){if(!wrong.length)return;problems=wrong.slice();index=0;correct=0;review=true;start=Date.now();$('done').style.display='none';$('game').style.display='block';show()}
document.querySelectorAll('#game .answer').forEach((el,i)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();setActive(i+1)});});
document.querySelectorAll('#keypad button').forEach(btn=>btn.addEventListener('pointerdown',e=>{unlockAudio();e.preventDefault();if(checking)return;const el=$('answer'+activeAnswer);const q=problems[index], ex=expected(q);const max=String(ex[activeAnswer-1]).length;if(el.value.length<max)el.value+=btn.dataset.key;if(el.value.length>=max && activeAnswer<2)setActive(activeAnswer+1);clearTimeout(timer);const inputs=[$('answer1'),$('answer2')];if(inputs.every((inp,i)=>inp.value!==''&&inp.value.length>=String(ex[i]).length))timer=setTimeout(check,140);}));
$('check').onclick=check;$('restart').onclick=reset;$('retry').onclick=retryWrong;$('again').onclick=reset;$('exit').onclick=()=>{try{window.close();}catch(e){} setTimeout(()=>{if(!$('done').style.display||$('done').style.display!=='none') $('bubble').innerHTML='학습을 마쳤어요!<br>참 잘했어요!';},120);};reset();

<script id="rm-viewport-guard">
(function(){
 function guard(){
  const game=document.querySelector('#game,.game'); if(!game)return;
  const buttons=[...game.querySelectorAll('button')];
  const confirm=buttons.find(b=>/확인/.test((b.textContent||'').trim()));
  if(!confirm)return;
  const bottom=confirm.getBoundingClientRect().bottom;
  const vh=window.innerHeight;
  document.documentElement.classList.toggle('rm-tight',bottom>vh-4);
 }
 addEventListener('load',guard);addEventListener('resize',guard);
 setTimeout(guard,150);
})();
</script>
